<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada – KJA Centro Psicológico</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="images/logo/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b2a5c, #08386f 45%, #004fb0);
            color: #fff;
            text-align: center;
            padding: 24px;
        }

        .caja {
            max-width: 460px;
        }

        .caja img {
            width: 90px;
            height: auto;
            margin-bottom: 18px;
        }

        .codigo {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
        }

        .filo {
            width: 120px;
            height: 3px;
            margin: 18px auto;
            border-radius: 2px;
            background: linear-gradient(90deg, #f10075, #ff4da6 40%, #0a63d4);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            font-size: .95rem;
            opacity: .85;
            margin-bottom: 26px;
        }

        .btn {
            display: inline-block;
            background: #f10075;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 999px;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(241, 0, 117, .35);
        }
    </style>
</head>

<body>
    <div class="caja">
        <img src="images/logo/kja.webp" alt="KJA Centro Psicológico">
        <div class="codigo">404</div>
        <div class="filo" aria-hidden="true"></div>
        <h1>No encontramos esta página</h1>
        <p>Puede que el enlace haya cambiado o ya no exista. Te esperamos en nuestra página principal.</p>
        <a class="btn" href="/">Volver al inicio</a>
    </div>
</body>

</html>
