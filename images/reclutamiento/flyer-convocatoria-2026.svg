<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 980" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a38"/>
      <stop offset="45%" stop-color="#09244c"/>
      <stop offset="100%" stop-color="#141738"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a8d"/>
      <stop offset="100%" stop-color="#fe037c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="928" height="980" fill="url(#bgGrad)"/>

  <!-- Decorative circles / ambient glows -->
  <circle cx="820" cy="140" r="220" fill="#fe037c" opacity="0.22" filter="url(#glowPink)"/>
  <circle cx="100" cy="780" r="260" fill="#0284c7" opacity="0.18" filter="url(#glowPink)"/>
  <circle cx="464" cy="500" r="380" fill="#3b82f6" opacity="0.06"/>

  <!-- Subtle grid lines pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="980"/>
    <line x1="240" y1="0" x2="240" y2="980"/>
    <line x1="464" y1="0" x2="464" y2="980"/>
    <line x1="688" y1="0" x2="688" y2="980"/>
    <line x1="848" y1="0" x2="848" y2="980"/>
    <line x1="0" y1="180" x2="928" y2="180"/>
    <line x1="0" y1="360" x2="928" y2="360"/>
    <line x1="0" y1="580" x2="928" y2="580"/>
    <line x1="0" y1="800" x2="928" y2="800"/>
  </g>

  <!-- Header: KJA Branding -->
  <g transform="translate(64, 52)">
    <!-- Brand Box -->
    <rect x="0" y="0" width="800" height="84" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>

    <!-- Heart & figures icon -->
    <circle cx="48" cy="42" r="26" fill="#fe037c" opacity="0.2"/>
    <circle cx="48" cy="42" r="18" fill="url(#pinkGrad)"/>
    <path d="M48 48 C41 43 38 39 38 36 C38 33.5 40 32 42.5 32 C44.5 32 46.5 33.5 48 35 C49.5 33.5 51.5 32 53.5 32 C56 32 58 33.5 58 36 C58 39 55 43 48 48 Z" fill="#ffffff"/>

    <text x="86" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">CENTRO PSICOLÓGICO KJA</text>
    <text x="86" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">Desarrollando mi bienestar · Registro Institucional</text>

    <!-- Right status pill -->
    <rect x="620" y="22" width="156" height="40" rx="20" fill="url(#pinkGrad)"/>
    <circle cx="638" cy="42" r="5" fill="#ffffff"/>
    <text x="652" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.8">VACANTES 2026</text>
  </g>

  <!-- Big Hero Title Section -->
  <g transform="translate(64, 168)">
    <!-- Pill Category -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="url(#pinkGrad)" opacity="0.95"/>
    <text x="20" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1">★ CONVOCATORIA OFICIAL 2026</text>

    <!-- Main Title -->
    <text x="0" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      PROGRAMA DE PRÁCTICAS
    </text>
    <text x="0" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#38bdf8" letter-spacing="-0.5">
      E INTERNADO CLÍNICO
    </text>

    <text x="0" y="180" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">
      Plazas para Psicología Clínica, Educativa, Organizacional y Psicopedagogía.
    </text>
  </g>

  <!-- 3 Pillars Grid -->
  <g transform="translate(64, 380)">
    <!-- Column 1: Certificación -->
    <g transform="translate(0, 0)">
      <rect width="250" height="230" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2" filter="url(#shadowBox)"/>
      <rect x="18" y="20" width="48" height="48" rx="14" fill="#0284c7" fill-opacity="0.25"/>
      <!-- Certificate Icon -->
      <path d="M34 32 H50 V54 L42 49 L34 54 Z" fill="#38bdf8"/>
      <circle cx="42" cy="38" r="4" fill="#ffffff"/>
      <text x="18" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Certificación Oficial</text>
      <text x="18" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Constancia de prácticas y</text>
      <text x="18" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">reconocimiento institucional</text>
      <text x="18" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">con valor curricular.</text>
      <rect x="18" y="190" width="96" height="22" rx="11" fill="#0284c7" fill-opacity="0.2"/>
      <text x="28" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">100% VÁLIDO</text>
    </g>

    <!-- Column 2: Capacitación -->
    <g transform="translate(275, 0)">
      <rect width="250" height="230" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2" filter="url(#shadowBox)"/>
      <rect x="18" y="20" width="48" height="48" rx="14" fill="#fe037c" fill-opacity="0.25"/>
      <!-- Brain / Growth Icon -->
      <circle cx="42" cy="44" r="10" stroke="#ff2a8d" stroke-width="2.5" fill="none"/>
      <path d="M42 38 V50 M36 44 H48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="18" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Formación Continua</text>
      <text x="18" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Capacitación clínica semanal,</text>
      <text x="18" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">estudio de casos reales</text>
      <text x="18" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">y ateneos formativos.</text>
      <rect x="18" y="190" width="102" height="22" rx="11" fill="#fe037c" fill-opacity="0.2"/>
      <text x="28" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff2a8d">SEMANAL</text>
    </g>

    <!-- Column 3: Modalidad -->
    <g transform="translate(550, 0)">
      <rect width="250" height="230" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2" filter="url(#shadowBox)"/>
      <rect x="18" y="20" width="48" height="48" rx="14" fill="#10b981" fill-opacity="0.25"/>
      <!-- Hybrid Icon -->
      <rect x="32" y="34" width="20" height="15" rx="2" stroke="#34d399" stroke-width="2.5" fill="none"/>
      <line x1="28" y1="52" x2="56" y2="52" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <text x="18" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Modalidad Dual</text>
      <text x="18" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Presencial en Sede San Luis</text>
      <text x="18" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">o Remoto virtual según tu</text>
      <text x="18" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">ciudad y disponibilidad.</text>
      <rect x="18" y="190" width="102" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
      <text x="28" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">FLEXIBLE</text>
    </g>
  </g>

  <!-- Requirements Highlights Banner -->
  <g transform="translate(64, 640)">
    <rect width="800" height="180" rx="24" fill="#051228" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadowBox)"/>

    <text x="32" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#38bdf8" letter-spacing="1">REQUISITOS DEL POSTULANTE</text>

    <!-- Checklist item 1 -->
    <circle cx="44" cy="80" r="12" fill="#10b981" fill-opacity="0.25"/>
    <path d="M39 80 L43 84 L50 75" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="68" y="85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">
      Estudiantes desde 7mo ciclo, internado y bachilleres de Psicología / Afines
    </text>

    <!-- Checklist item 2 -->
    <circle cx="44" cy="116" r="12" fill="#10b981" fill-opacity="0.25"/>
    <path d="M39 116 L43 120 L50 111" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="68" y="121" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">
      Difusión en grupos de Facebook y compromiso institucional puntual
    </text>

    <!-- Checklist item 3 -->
    <circle cx="44" cy="152" r="12" fill="#10b981" fill-opacity="0.25"/>
    <path d="M39 152 L43 156 L50 147" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="68" y="157" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#ffffff">
      Turnos de 4 a 6 horas diarias coordinadas con tu horario de clases
    </text>
  </g>

  <!-- Bottom Action & Location -->
  <g transform="translate(64, 850)">
    <rect width="800" height="74" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Pin icon -->
    <circle cx="44" cy="37" r="18" fill="#fe037c" fill-opacity="0.2"/>
    <path d="M44 26 C40.5 26 38 28.5 38 32 C38 36.5 44 45 44 45 C44 45 50 36.5 50 32 C50 28.5 47.5 26 44 26 Z" fill="#fe037c"/>
    <circle cx="44" cy="31" r="2.5" fill="#ffffff"/>

    <text x="74" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Sede San Luis: Jr. Río Amazonas 214 · Lima, Perú</text>
    <text x="74" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Convocatoria Semestral Oficial · Centro Psicológico KJA</text>

    <!-- Action button -->
    <rect x="580" y="16" width="196" height="42" rx="21" fill="url(#pinkGrad)"/>
    <text x="618" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">CLICK PARA AMPLIAR 🔍</text>
  </g>
</svg>
