<!doctype html><html lang="es"><meta charset="utf-8"><title>KJA · Revisión de dirección visual</title>
<style>
*{box-sizing:border-box}body{margin:40px auto;max-width:1160px;padding:0 24px;background:#faf6ef;color:#38312b;font:16px/1.5 Inter,system-ui,sans-serif}h1,h2{font-family:Georgia,serif}h1{margin-bottom:4px}p{max-width:84ch}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}.sample{padding:24px;background:radial-gradient(ellipse at 8% 85%,#c8b8a4,transparent 60%),linear-gradient(135deg,#f6eee2,#d9e4d6)}.card{padding:16px;border-radius:16px;background:rgba(255,253,249,.88);border:1px solid #d3c9bc;box-shadow:0 4px 16px #46372b12}.blur .card{backdrop-filter:blur(6px)}summary{cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:650;list-style:none}summary:after{content:'⌄';margin-left:auto}details[open] summary:after{transform:rotate(180deg)}summary:focus-visible{outline:2px solid #527966;outline-offset:4px}small{font-weight:400}ul{list-style:none;padding:0;margin:14px 0 0}li{border-top:1px solid #d7cfc4;padding:10px 0;display:flex;justify-content:space-between}em{font:500 13px system-ui;color:#365e4a;background:#e8f0e8;padding:3px 8px;border-radius:99px}.shots{display:grid;grid-template-columns:1fr 1fr;gap:18px}.shots img{width:100%;border:1px solid #ccc}a{color:#73472f}
</style><h1>Dirección visual de administración</h1><p>Compara la misma agrupación con dos tratamientos de superficie. Abre o contrae Ingeniería para revisar el control. Datos de ejemplo.</p><main id="samples"></main>
<script>for(const [title,cls] of [['A · Translúcido sin desenfoque',''],['B · Desenfoque ligero, 6 px','blur']]){const section=document.createElement('section');section.className=cls;section.innerHTML='<h2>'+title+'</h2><div class="sample"><div class="card"><details open><summary>Ingeniería <small>2 personas</small></summary><ul><li>Ana Ruiz <em>Presente</em></li><li>Luis Díaz <em>Presente</em></li></ul></details></div></div>';document.querySelector('main').append(section)}</script>
<h2>Panel actual</h2><div class="shots"><a href="contratos.png"><img src="contratos.png" alt="Vista actual de Contratos">Contratos</a><a href="colaboradores.png"><img src="colaboradores.png" alt="Vista actual de Colaboradores">Colaboradores</a></div>
