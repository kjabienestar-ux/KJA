# dash-entrar recibe la clave publicable y valida DNI + PIN dentro de la
# función. La verificación JWT antigua no admite claves sb_publishable_.
[functions.dash-entrar]
verify_jwt = false

# Esta función solo se usa con la sesión autenticada obtenida al entrar.
[functions.dash-evidencia]
verify_jwt = true

# Emite permisos de un solo uso para las evidencias del cierre diario.
[functions.dash-entrega]
verify_jwt = true

# Publicaciones valida además usuario, permiso y propiedad dentro del manejador.
[functions.marketing-publicaciones]
verify_jwt = true
